name: flashcart_ai
description: "FlashCart AI - Production Cross-Platform Customer and Rider Mobile App"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network & API Connections
  dio: ^5.4.0
  socket_io_client: ^3.1.1

  # Local DB & Persistence
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4

  # Navigation
  go_router: ^16.0.0

  # Google Maps & Geolocation
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Firebase Integration Suite
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  google_sign_in: ^6.3.0

  # Visual Styling & Micro-animations
  cupertino_icons: ^1.0.6
  lucide_flutter: 1.25.0
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

  # Razorpay Payment Gateway
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/eco_banner.jpg
    - assets/icons/app_icon.jpg